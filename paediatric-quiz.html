<html lang="en">
<head>

<title>Paediatric optometry quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f8f9;--card:#fff;--ink:#10343d;--mute:#56747b;--line:#cfe0e3;--teal:#1b7f8c;--tealbg:#d9eef0;--bad:#a8402f;--good:#2b7a4b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f2429;--card:#16333a;--ink:#e4f1f3;--mute:#9bb8be;--line:#2a4a52;--teal:#5cc3cf;--tealbg:#1f4a52;--bad:#f0a090;--good:#8bd3a6}}
:root[data-theme="dark"]{--bg:#0f2429;--card:#16333a;--ink:#e4f1f3;--mute:#9bb8be;--line:#2a4a52;--teal:#5cc3cf;--tealbg:#1f4a52;--bad:#f0a090;--good:#8bd3a6}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 "Source Sans 3",system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:28px 18px 48px}
h1{font:500 30px/1.15 Fraunces,Georgia,serif;margin:0 0 10px}
p{margin:0 0 14px}
.mute{color:var(--mute);font-size:15px}
button{font:600 17px "Source Sans 3",system-ui,sans-serif;min-height:48px;padding:0 20px;border-radius:8px;border:1.5px solid var(--teal);background:var(--teal);color:#fff;cursor:pointer;width:100%}
button.opt{background:var(--card);color:var(--ink);border:1.5px solid var(--line);text-align:left;margin:0 0 10px;padding:12px 16px;font-weight:400;height:auto;user-select:none}
button.opt.sel{border-color:var(--teal);background:var(--tealbg)}
button.alt{background:var(--card);color:var(--teal)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
input{width:100%;min-height:48px;padding:0 14px;font:400 17px "Source Sans 3",system-ui,sans-serif;border:1.5px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);margin:0 0 14px}
.err{color:var(--bad);font-size:15px;min-height:22px;margin:4px 0 10px}
.top{display:flex;justify-content:space-between;font-size:15px;color:var(--mute)}
.bar{height:5px;background:var(--line);border-radius:3px;margin:8px 0 22px}
.bar i{display:block;height:5px;background:var(--teal);border-radius:3px}
.q{font:500 22px/1.3 Fraunces,Georgia,serif;margin:0 0 18px;user-select:none}
.row{display:flex;gap:10px;margin:0 0 12px}.row button{flex:1}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:0 0 16px}
button.qn{padding:0;min-height:46px;background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
button.qn.done{background:var(--teal);color:#fff;border-color:var(--teal)}
button.qn.cur{box-shadow:0 0 0 3px var(--ink)}
.rv{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0 0 12px}
.rv .rq{font-weight:600;margin:0 0 8px}
.rv p{margin:0 0 6px;font-size:16px}
.no{color:var(--bad)}.yes{color:var(--good)}
.code{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:16px;word-break:break-word;margin:0 0 14px}
a.btn{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:8px;background:var(--teal);color:#fff;text-decoration:none;font-weight:600;margin-top:4px}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .25s}}
</style>
</head>

d", "Eye-of-origin information is lost at the cortical level", "The pupils are small"], 2, "Axons from both eyes synapse on the same binocular cells, so the origin of the information isn't retained."], ["In stage one, axons from both eyes synapse on the same binocular cells in:", ["The optic chiasm", "The retina", "Layer IV of the visual cortex", "The LGN"], 2, "The response is summed from stimulation of both eyes."], ["Under dissociated viewing, infants under 3–4 months prefer the rivalrous screen because:", ["They are strabismic", "It is more comfortable to look at", "They perceive true rivalry", "They perceive a combination of the gratings with more contours"], 3, "The combined horizontal and vertical grating is more interesting."], ["Infants over 3–4 months prefer the fusible grating screen because:", ["They are bored", "Rivalrous gratings are disturbing and the fused screen is more comfortable to fixate", "They can't see colour", "The fused screen has more contours"], 1, "This suggests they are now perceiving rivalry."], ["What happens in stage two of Held's model?", ["Ocular dominance columns segregate, preserving eye-of-origin information so disparity can be detected", "The columns merge", "The pupils constrict", "The retina matures"], 0, "This allows binocular cells to compare input from the two eyes."], ["Ocular dominance columns are partially segregated by about:", ["4 months", "2 years", "Birth", "10 years"], 0, "Segregation is complete by about 6 months."], ["Gross stereopsis is present by about:", ["2 years", "5 years", "Birth", "3–4 months"], 3, "Finer, more mature stereoscopic responses appear by 6 months."], ["Adults with normal vision viewing rivalrous gratings usually:", ["Suppress both gratings", "See a three-dimensional image", "Alternate between the two and find it uncomfortable", "See a stable fused image"], 2, "The normal system perceives one grating or the other, with predominance in those with a strongly dominant eye."], ["Which is the appropriate cycloplegic for paediatric refraction?", ["Phenylephrine", "Cyclopentolate", "Tropicamide", "Fluorescein"], 1, "Tropicamide leaves residual accommodative facility, so it is unsuitable."], ["After instilling a cycloplegic, how long is it usual to wait before retinoscopy?", ["About 24 hours", "About 2 minutes", "About 30 minutes", "About 3 hours"], 2, "Check that the pupil is dilated before refracting."], ["After cycloplegic drops, parents should be told that accommodation is impaired for about:", ["30 minutes", "Permanently", "1 week", "3 hours, while pupil dilation may last up to 24 hours"], 3, "The child is also left with blur for near tasks."], ["Cycloplegic refraction is contraindicated in a child with:", ["Developmental delay", "Abnormal anterior chamber structure, such as glaucoma or aniridia", "Suspected squint", "Down syndrome"], 1, "It is not contraindicated in developmental delay or Down syndrome."], ["Why is cycloplegic retinoscopy the gold standard?", ["It is the fastest method", "It needs no cooperation", "It controls accommodation and reveals latent hyperopia", "It is painless"], 2, "Disadvantages are discomfort, longer testing time and blur afterwards."], ["When is cycloplegic retinoscopy especially recommended?", ["Only for school-age children", "Never when squint is suspected", "Only for adults", "At a pre-school child's first test, with suspected squint, or before prescribing glasses"], 3, "It ensures the full level of hyperopia is found."], ["Mohindra near retinoscopy is performed at:", ["6 m in a bright room", "25 cm in a bright room", "50 cm in a totally dark room", "1 m with room lights on"], 2, "A dim retinoscope light is a poor stimulus, so accommodation relaxes to its tonic level."], ["In Mohindra retinoscopy, the correction factor removed for a child over 24 months is:", ["1.00 D", "0.75 D", "2.00 D", "0.50 D"], 0, "For infants under 24 months the factor is 0.75 D."], ["Why is the eye not being tested occluded during Mohindra retinoscopy?", ["To dilate it", "To dim the room", "To keep the eye warm", "To prevent convergence-induced accommodation"], 3, "The practitioner also checks pupil dilation and stability of the reflex, and uses a cycloplegic if in doubt."], ["In dynamic retinoscopy, a 'with' movement at the target distance indicates:", ["Hyperopia only", "A lag of accommodation (under-accommodation)", "A lead of accommodation", "Accurate accommodation"], 1, "A neutral reflex is accurate accommodation, and 'against' is a lead."], ["A target at 25 cm (4 D demand) is held, and neutral is found with the retinoscope at 40 cm (2.50 D). What is the accommodative lag?", ["0.75 D", "1.50 D", "2.50 D", "4.00 D"], 1, "Lag = demand minus response = 4.00 − 2.50 = 1.50 D."], ["A child with Down syndrome has reduced accommodation. Which prescription may help?", ["Atropine", "Patching", "Prism", "Bifocal spectacles"], 3, "Bifocals give clear near vision, with the segment fitted high for children."], ["What does 'infant brains learn to see' imply?", ["Normal visual experience is needed for normal visual development", "Experience has no effect", "Vision is hard-wired at birth", "Only genetics matters"], 0, "Barriers such as ptosis or infant cataract stop the affected eye learning to see properly."], ["Plasticity means:", ["The malleable nature of the visual system, which experience can shape", "Resistance to change", "Rigid wiring", "Loss of vision"], 0, "It is not infinite and is considered in relation to the critical period."], ["The critical period for visual acuity treatment extends to about:", ["7–8 years", "20 years", "2 weeks", "1 year"], 0, "After this, treatment of amblyopia has limited effect."], ["Over-enthusiastic patching in a young child can cause:", ["Occlusion amblyopia in the originally non-amblyopic eye", "Myopia only", "Strabismus only", "Cataract"], 0, "This risk is greatest up to about 2.5–3 years."], ["After monocular deprivation in Hubel and Wiesel's experiments, the visual cortex showed:", ["More cells for the deprived eye", "Equal loss of cells for both eyes", "Far fewer cells representing the deprived eye", "No change"], 2, "The cortical representation of the non-deprived eye far outweighed that of the deprived eye."], ["How did Hubel and Wiesel reveal the ocular dominance columns?", ["By injecting radioactive tracer into one eye and examining the post-mortem cortex", "By MRI scanning", "By VEP recordings alone", "By fitting contact lenses"], 0, "Fluorescing cells in the cortex corresponded to the injected eye."], ["Visual acuity in a deprived eye improved when the non-deprived eye was removed. This shows:", ["The deprived eye was normal", "Enucleation causes growth of visual cortex", "Acuity is unrelated to the other eye", "Active inhibition by the stronger non-deprived eye"], 3, "The visual system develops competitively, and an occluded eye still competes with the deprived eye."], ["For the same length of monocular deprivation, onset earlier in the critical period:", ["Has a more dramatic effect", "Has a milder effect", "Has no effect", "Matters only in adults"], 0, "Early deprivation is the most damaging."], ["Earlier reversal of deprivation leads to:", ["No recovery", "Slower recovery", "Quicker and more complete recovery", "Permanent loss"], 2, "Reversal must occur within the sensitive period."], ["For deprivation at the same developmental stage, a longer duration:", ["Improves vision", "Causes less disruption", "Makes no difference", "Causes proportionally more disruption"], 3, "Prompt treatment is important, particularly in early-onset conditions."], ["A visually disruptive congenital cataract is routinely removed in the UK before:", ["Seven years of age", "Two months of age", "Two years of age", "Twelve months of age"], 1, "This maximises the chance of a good visual outcome."], ["Why is it sensible that cortical connections are not adult-like at birth?", ["They must change as retinal structure, eye size and eye position change with growth", "The eyes don't grow", "Infants lack neurons", "They are irrelevant to growth"], 0, "Functions that mature more slowly are more at risk from abnormal visual experience."]];

 };

  h+='<h2 style="font:500 22px Fraunces,Georgia,serif;margin:18px 0 6px">Your answers</h2><p class="mute">'+s.score+' correct, '+wrong+' wrong or unanswered. Correct answers are marked. Each wrong one shows the right answer and why.</p><div class="row"><button id="fa" class="'+(only?'alt':'')+'">All questions</button><button id="fw" class="'+(only?'':'alt')+'">Wrong only</button></div>';
  for(var k=0;k<r.length;k++){
   if(only&&r[k][5]){continue;}
   if(r[k][5]){h+='<div class="rv"><p class="rq">'+r[k][1]+'</p><p class="yes"><b>Correct:</b> '+r[k][3]+'</p></div>';}
   else{h+='<div class="rv"><p class="rq">'+r[k][1]+'</p><p class="no">Your answer: '+r[k][2]+'</p><p class="yes">Correct answer: '+r[k][3]+'</p><p><b>Why:</b> '+r[k][4]+'</p></div>';}
  }
  h+='<p>Your result code:</p><div class="code">'+s.code+'</div><button id="cp" class="alt">Copy result code</button><div class="err" id="cerr"></div><a class="btn" href="quit.html">Exit exam</a>';
  app.innerHTML=h;
  document.getElementById("fa").onclick=function(){only=false;draw();};
  document.getElementById("fw").onclick=function(){only=true;draw();};
  document.getElementById("cp").onclick=function(){var m=document.getElementById("cerr");try{navigator.clipboard.writeText(s.code).then(function(){m.textContent="Copied.";},function(){m.textContent="Select the code above and copy it.";});}catch(e){m.textContent="Select the code above and copy it.";}};
 }
 draw();window.scrollTo(0,0);
}
document.addEventListener("visibilitychange",function(){if(active&&document.hidden){sw++;}});
document.addEventListener("contextmenu",function(e){if(active){e.preventDefault();}});
document.addEventListener("copy",function(e){if(active){e.preventDefault();}});
gate();
</script>
